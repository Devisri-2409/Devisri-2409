name: Update GitHub Activity Graph

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_activity_graph.py"
      - ".github/workflows/update-activity.yml"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
      - name: Generate contribution graph
        run: python scripts/generate_activity_graph.py
      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity.svg
          if git diff --cached --quiet; then
            echo "No activity graph changes."
            exit 0
          fi
          git commit -m "Update GitHub activity graph"
          git push
